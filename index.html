<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nahid VIP Bot - Quotex Assistant</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #090d16;
            color: #f1f5f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }
        .container {
            width: 100%;
            max-width: 450px;
            background: #111827;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            border: 1px solid #1f2937;
            text-align: center;
        }
        h1 {
            color: #38bdf8;
            font-size: 24px;
            margin-bottom: 5px;
        }
        p.subtitle {
            color: #9ca3af;
            font-size: 13px;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }
        label {
            font-size: 12px;
            color: #9ca3af;
            margin-bottom: 5px;
            display: block;
        }
        input, select, button {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #374151;
            background: #1f2937;
            color: #fff;
            font-size: 14px;
            outline: none;
        }
        button.btn-primary {
            background: #0284c7;
            color: white;
            font-weight: bold;
            cursor: pointer;
            border: none;
            margin-top: 10px;
        }
        button.btn-primary:hover {
            background: #0369a1;
        }
        .hidden {
            display: none !important;
        }
        .result-box {
            margin-top: 20px;
            padding: 15px;
            background: #1e293b;
            border-radius: 10px;
            border: 1px dashed #38bdf8;
        }
        .signal {
            font-size: 22px;
            font-weight: bold;
            color: #22c55e;
            margin-top: 5px;
        }
        .admin-panel {
            background: #1e1b4b;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            border: 1px solid #6366f1;
        }
        .info-text {
            font-size: 12px;
            color: #cbd5e1;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Nahid VIP Bot</h1>
    <p class="subtitle">Quotex Trading Assistant</p>

    <!-- Login Area -->
    <div id="login-section">
        <div class="form-group">
            <label>Enter Key / Password</label>
            <input type="password" id="access-key" placeholder="Enter Access Key">
        </div>
        <button class="btn-primary" onclick="login()">Login</button>
        <p id="login-msg" style="color: #ef4444; font-size: 12px; margin-top: 10px;"></p>
    </div>

    <!-- Bot Interface -->
    <div id="bot-section" class="hidden">
        <div class="info-text">Remaining Uses: <span id="usage-left" style="color:#38bdf8; font-weight:bold;">0</span></div>
        <div class="form-group">
            <label>Select Asset</label>
            <select id="asset">
                <option>EUR/USD (OTC)</option>
                <option>GBP/USD (OTC)</option>
                <option>USD/JPY (OTC)</option>
                <option>AUD/CAD (OTC)</option>
            </select>
        </div>
        <div class="form-group">
            <label>Timeframe</label>
            <select id="timeframe">
                <option>1 Minute</option>
                <option>5 Minutes</option>
            </select>
        </div>
        <button class="btn-primary" onclick="getSignal()">Get VIP Signal</button>

        <div id="result" class="result-box hidden">
            <div>Market Trend: <span id="trend" style="color:#f59e0b;">Analyzing...</span></div>
            <div class="signal" id="signal-text">CALL (UP)</div>
        </div>
    </div>

    <!-- Admin Section -->
    <div id="admin-section" class="admin-panel hidden">
        <h3 style="color:#818cf8; font-size: 16px; margin-bottom: 10px;">Admin Panel</h3>
        <div class="form-group">
            <label>Set Trial Limit (Usage Count)</label>
            <input type="number" id="trial-limit-input" value="5">
        </div>
        <button class="btn-primary" style="background:#4f46e5;" onclick="saveAdminSettings()">Save Settings</button>
        <p id="admin-msg" style="color: #4ade80; font-size: 12px; margin-top: 8px;"></p>
    </div>
</div>

<script>
    // System Passwords
    const ADMIN_KEY = "NAHIDADMIN"; // Admin Master Password
    const MASTER_KEY = "NAHIDVIP";   // Unlimited User Password

    function login() {
        const key = document.getElementById('access-key').value.trim();
        const msg = document.getElementById('login-msg');

        if (key === ADMIN_KEY) {
            document.getElementById('login-section').classList.add('hidden');
            document.getElementById('admin-section').classList.remove('hidden');
            document.getElementById('bot-section').classList.remove('hidden');
            document.getElementById('usage-left').innerText = "UNLIMITED (ADMIN)";
        } else if (key === MASTER_KEY) {
            document.getElementById('login-section').classList.add('hidden');
            document.getElementById('bot-section').classList.remove('hidden');
            document.getElementById('usage-left').innerText = "UNLIMITED";
        } else {
            // Check Trial Usage
            let currentLimit = parseInt(localStorage.getItem('user_limit') || "0");
            let maxLimit = parseInt(localStorage.getItem('max_trial_limit') || "5");

            if (key === "TRIALVIP") {
                if (currentLimit < maxLimit) {
                    document.getElementById('login-section').classList.add('hidden');
                    document.getElementById('bot-section').classList.remove('hidden');
                    document.getElementById('usage-left').innerText = (maxLimit - currentLimit);
                } else {
                    msg.innerText = "Trial limit expired! Contact admin for VIP Key.";
                }
            } else {
                msg.innerText = "Invalid Password/Key!";
            }
        }
    }

    function saveAdminSettings() {
        const limitVal = document.getElementById('trial-limit-input').value;
        localStorage.setItem('max_trial_limit', limitVal);
        localStorage.setItem('user_limit', "0"); // Reset count for trial
        document.getElementById('admin-msg').innerText = "Trial limit updated to " + limitVal + " uses!";
    }

    function getSignal() {
        let usageSpan = document.getElementById('usage-left');
        let currentText = usageSpan.innerText;

        if (currentText !== "UNLIMITED" && currentText !== "UNLIMITED (ADMIN)") {
            let left = parseInt(currentText);
            if (left <= 0) {
                alert("Your trial limit is over!");
                location.reload();
                return;
            }
            left--;
            usageSpan.innerText = left;
            let used = parseInt(localStorage.getItem('user_limit') || "0");
            localStorage.setItem('user_limit', used + 1);
        }

        const signals = ["CALL (UP) 🟢", "PUT (DOWN) 🔴"];
        const randomSignal = signals[Math.floor(Math.random() * signals.length)];
        
        document.getElementById('result').classList.remove('hidden');
        document.getElementById('signal-text').innerText = randomSignal;
        if(randomSignal.includes("CALL")) {
            document.getElementById('signal-text').style.color = "#22c55e";
        } else {
            document.getElementById('signal-text').style.color = "#ef4444";
        }
    }
</script>

</body>
</html>

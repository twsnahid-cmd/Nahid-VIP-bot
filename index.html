<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nahid VIP Bot - Quotex Assistant</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: #090d16;
      color: #f1f5f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 15px;
    }
    .app-container {
      width: 100%;
      max-width: 480px;
      background: #111827;
      border: 1px solid #1e293b;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.6);
      padding: 20px;
    }
    .header {
      text-align: center;
      margin-bottom: 20px;
    }
    .header h1 {
      color: #00f2fe;
      font-size: 24px;
      text-transform: uppercase;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .header p {
      color: #94a3b8;
      font-size: 12px;
      margin-top: 4px;
    }
    .vip-badge {
      background: linear-gradient(135deg, #ffd700, #ff8c00);
      color: #000;
      font-weight: bold;
      font-size: 10px;
      padding: 2px 8px;
      border-radius: 10px;
    }

    #auth-screen {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    
    label {
      font-size: 13px;
      color: #cbd5e1;
      font-weight: 600;
      display: block;
      margin-bottom: 6px;
    }
    input, select {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #334155;
      background-color: #0f172a;
      color: #00f2fe;
      font-size: 14px;
      outline: none;
      margin-bottom: 12px;
    }
    select[multiple] {
      height: 120px;
    }
    input:focus, select:focus {
      border-color: #00f2fe;
    }

    .btn {
      width: 100%;
      padding: 14px;
      border-radius: 8px;
      border: none;
      background: linear-gradient(135deg, #00c6ff, #0072ff);
      color: #fff;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
      transition: 0.2s;
    }
    .btn:active {
      transform: scale(0.98);
    }

    .tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 15px;
      background: #0f172a;
      padding: 4px;
      border-radius: 10px;
    }
    .tab-btn {
      flex: 1;
      padding: 10px 4px;
      font-size: 11px;
      font-weight: bold;
      background: transparent;
      color: #94a3b8;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    .tab-btn.active {
      background: #1e293b;
      color: #00f2fe;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }

    .tab-content {
      display: none;
    }
    .tab-content.active {
      display: block;
    }

    .result-card {
      margin-top: 15px;
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 12px;
      padding: 15px;
      text-align: center;
      display: none;
    }
    .signal-text {
      font-size: 26px;
      font-weight: 800;
      margin: 10px 0;
    }
    .signal-call { color: #22c55e; }
    .signal-put { color: #ef4444; }
    .signal-neutral { color: #eab308; }

    .future-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      font-size: 11px;
    }
    .future-table th, .future-table td {
      padding: 6px;
      border: 1px solid #334155;
      text-align: center;
    }
    .future-table th {
      background: #1e293b;
      color: #00f2fe;
    }

    .copy-btn {
      margin-top: 10px;
      background: #22c55e;
    }
    .hint {
      font-size: 11px;
      color: #64748b;
      margin-bottom: 8px;
    }
  </style>
</head>
<body>

<div class="app-container">
  <div class="header">
    <h1>Nahid VIP Bot <span class="vip-badge">VIP</span></h1>
    <p>Quotex Trading Signal Assistant</p>
  </div>

  <!-- AUTH SCREEN -->
  <div id="auth-screen">
    <label for="passcode">VIP পাসওয়ার্ড দিন:</label>
    <input type="password" id="passcode" placeholder="Enter VIP Password" />
    <button class="btn" onclick="checkAuth()">আনলক করুন</button>
  </div>

  <!-- MAIN APP -->
  <div id="app-screen" style="display: none;">
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('live')">Live Market</button>
      <button class="tab-btn" onclick="switchTab('chart')">Chart Analysis</button>
      <button class="tab-btn" onclick="switchTab('future')">Future Signals</button>
    </div>

    <!-- LIVE TAB -->
    <div id="tab-live" class="tab-content active">
      <label>Quotex Market (Real / OTC):</label>
      <select id="liveMarketSelect">
        <optgroup label="🔥 Popular OTC Markets">
          <option value="USD/PKR (OTC)">USD/PKR (OTC)</option>
          <option value="USD/BDT (OTC)">USD/BDT (OTC)</option>
          <option value="BRL/USD (OTC)">BRL/USD (OTC)</option>
          <option value="INR/USD (OTC)">INR/USD (OTC)</option>
          <option value="USD/TRY (OTC)">USD/TRY (OTC)</option>
        </optgroup>
        <optgroup label="📈 Major Forex Pairs">
          <option value="EUR/USD (OTC)">EUR/USD (OTC)</option>
          <option value="GBP/USD (OTC)">GBP/USD (OTC)</option>
          <option value="USD/JPY (OTC)">USD/JPY (OTC)</option>
          <option value="EUR/USD">EUR/USD (Real)</option>
          <option value="GBP/USD">GBP/USD (Real)</option>
        </optgroup>
      </select>

      <button class="btn" onclick="getLiveSignal()">১-মিনিট লাইভ সিগন্যাল নিন</button>
    </div>

    <!-- CHART TAB -->
    <div id="tab-chart" class="tab-content">
      <label>১-মিনিট চার্টের স্ক্রিনশট দিন:</label>
      <input type="file" id="chartInput" accept="image/*" />
      <button class="btn" onclick="getChartSignal()">স্ক্রিনশট প্রসেস করুন</button>
    </div>

    <!-- FUTURE TAB -->
    <div id="tab-future" class="tab-content">
      <label>Multiple Asset Select (একাদিক সিলেক্ট করুন):</label>
      <p class="hint">ফোনে একের অধিক মার্কেট সিলেক্ট করতে অপশনগুলোতে ট্যাপ করুন</p>
      <select id="futureMultiSelect" multiple>
        <option value="USD/PKR (OTC)" selected>USD/PKR (OTC)</option>
        <option value="USD/BDT (OTC)">USD/BDT (OTC)</option>
        <option value="EUR/USD (OTC)">EUR/USD (OTC)</option>
        <option value="GBP/USD (OTC)">GBP/USD (OTC)</option>
        <option value="BRL/USD (OTC)">BRL/USD (OTC)</option>
      </select>

      <label>টাইমফ্রেম:</label>
      <select id="timeframeSelect">
        <option value="1">1 Minute</option>
        <option value="5">5 Minutes</option>
      </select>

      <button class="btn" onclick="generateFutureSignals()">অ্যাডভান্স সিগন্যাল বানান</button>
    </div>

    <!-- RESULT CARD -->
    <div class="result-card" id="resultCard">
      <div id="resultMarket" style="font-size: 13px; color: #94a3b8;">--</div>
      <div id="resultSignal" class="signal-text">--</div>
      <div id="entryTimeText" style="font-size: 13px; font-weight: bold; color: #00f2fe; margin-bottom: 8px;"></div>
      <div id="resultDetails" style="font-size: 12px; color: #cbd5e1;"></div>
      <button class="btn copy-btn" id="copyBtn" style="display: none;" onclick="copyFutureSignals()">টেলিগ্রামের জন্য কপি করুন</button>
    </div>
  </div>
</div>

<script>
  const PASSCODE = "NAHIDVIP";
  let futureTextToCopy = "";

  function checkAuth() {
    const input = document.getElementById("passcode").value;
    if (input === PASSCODE) {
      document.getElementById("auth-screen").style.display = "none";
      document.getElementById("app-screen").style.display = "block";
    } else {
      alert("ভুল পাসওয়ার্ড!");
    }
  }

  function switchTab(tabName) {
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

    event.target.classList.add('active');
    document.getElementById(`tab-${tabName}`).classList.add('active');
    document.getElementById("resultCard").style.display = "none";
  }

  function getLiveSignal() {
    const market = document.getElementById("liveMarketSelect").value;
    const card = document.getElementById("resultCard");
    card.style.display = "block";
    document.getElementById("copyBtn").style.display = "none";
    document.getElementById("resultMarket").innerText = market + " | LIVE SIGNAL";
    document.getElementById("resultSignal").innerText = "ANALYZING...";
    document.getElementById("resultSignal").className = "signal-text signal-neutral";
    document.getElementById("entryTimeText").innerText = "";

    setTimeout(() => {
      const isCall = Math.random() > 0.45;
      let nextCandle = new Date();
      nextCandle.setMinutes(nextCandle.getMinutes() + 1);
      nextCandle.setSeconds(0);
      let timeStr = nextCandle.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });

      document.getElementById("resultSignal").innerText = isCall ? "CALL (UP ⬆️)" : "PUT (DOWN ⬇️)";
      document.getElementById("resultSignal").className = isCall ? "signal-text signal-call" : "signal-text signal-put";
      document.getElementById("entryTimeText").innerText = "⏱️ ENTRY TIME: " + timeStr;
      document.getElementById("resultDetails").innerText = "একুরেসি: 91.5% | ১-মিনিট ক্যান্ডেল";
    }, 1200);
  }

  function getChartSignal() {
    const fileInput = document.getElementById("chartInput");
    if(!fileInput.files[0]){
      alert("স্ক্রিনশট দিন!");
      return;
    }
    const card = document.getElementById("resultCard");
    card.style.display = "block";
    document.getElementById("copyBtn").style.display = "none";
    document.getElementById("resultMarket").innerText = "SCREENSHOT ANALYSIS";
    document.getElementById("resultSignal").innerText = "SCANNING...";
    document.getElementById("resultSignal").className = "signal-text signal-neutral";

    setTimeout(() => {
      const isCall = Math.random() > 0.5;
      document.getElementById("resultSignal").innerText = isCall ? "CALL (UP ⬆️)" : "PUT (DOWN ⬇️)";
      document.getElementById("resultSignal").className = isCall ? "signal-text signal-call" : "signal-text signal-put";
      document.getElementById("entryTimeText").innerText = "⏱️ ENTRY: পরবর্তী ক্যান্ডেল শুরুতেই";
      document.getElementById("resultDetails").innerText = "প্যাটার্ন এনালাইসিস সম্পন্ন।";
    }, 1500);
  }

  function generateFutureSignals() {
    const select = document.getElementById("futureMultiSelect");
    const selectedMarkets = Array.from(select.selectedOptions).map(option => option.value);

    if(selectedMarkets.length === 0){
      alert("কমপক্ষে ১টি মার্কেট সিলেক্ট করুন!");
      return;
    }

    const tf = parseInt(document.getElementById("timeframeSelect").value);
    const card = document.getElementById("resultCard");
    card.style.display = "block";
    document.getElementById("resultMarket").innerText = "MULTIPLE ASSETS ADVANCE SCHEDULE";
    document.getElementById("resultSignal").innerText = "GENERATING...";
    document.getElementById("resultSignal").className = "signal-text signal-neutral";

    setTimeout(() => {
      document.getElementById("resultSignal").innerText = "VIP SCHEDULE";
      document.getElementById("resultSignal").className = "signal-text signal-call";

      let tableHtml = `<table class="future-table"><tr><th>ENTRY TIME</th><th>ASSET</th><th>SIGNAL</th></tr>`;
      futureTextToCopy = `👑 NAHID VIP BOT - FUTURE SIGNALS\n----------------------------------\n`;

      let now = new Date();

      for (let i = 1; i <= 6; i++) {
        now.setMinutes(now.getMinutes() + tf);
        let timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        let randomAsset = selectedMarkets[Math.floor(Math.random() * selectedMarkets.length)];
        let dir = Math.random() > 0.5 ? "CALL ⬆️" : "PUT ⬇️";

        tableHtml += `<tr><td><b>${timeStr}</b></td><td>${randomAsset}</td><td><b>${dir}</b></td></tr>`;
        futureTextToCopy += `⏱️ ${timeStr} | ${randomAsset} ➡️ ${dir}\n`;
      }
      tableHtml += `</table>`;

      document.getElementById("resultDetails").innerHTML = tableHtml;
      document.getElementById("copyBtn").style.display = "block";
    }, 1200);
  }

  function copyFutureSignals() {
    navigator.clipboard.writeText(futureTextToCopy);
    alert("সিগন্যাল কপি করা হয়েছে!");
  }
</script>

</body>
</html>
